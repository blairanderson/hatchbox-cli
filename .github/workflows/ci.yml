name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Run tests
        run: ruby -Itest -Ilib -e 'Dir["test/test_*.rb"].each { |f| require File.expand_path(f) }'
      - name: Smoke-check the executable
        run: ./bin/hatchbox --version
